<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>CET-4 四级长难句闯关特训</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --primary-fg: #ffffff;
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.12);
      --err: #dc2626;
      --err-soft: rgba(220, 38, 38, 0.12);
      --subj-bg: rgba(37, 99, 235, 0.14);
      --subj-fg: #1d4ed8;
      --verb-bg: rgba(220, 38, 38, 0.14);
      --verb-fg: #b91c1c;
      --obj-bg: rgba(5, 150, 105, 0.14);
      --obj-fg: #047857;
      --mod-bg: rgba(100, 116, 139, 0.12);
      --mod-fg: #475569;
      --shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
      --radius: 16px;
    }

    html.dark {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #263244;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-fg: #ffffff;
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.16);
      --err: #f87171;
      --err-soft: rgba(248, 113, 113, 0.16);
      --subj-bg: rgba(96, 165, 250, 0.22);
      --subj-fg: #93c5fd;
      --verb-bg: rgba(248, 113, 113, 0.22);
      --verb-fg: #fca5a5;
      --obj-bg: rgba(52, 211, 153, 0.2);
      --obj-fg: #6ee7b7;
      --mod-bg: rgba(148, 163, 184, 0.16);
      --mod-fg: #cbd5e1;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 14px 24px;
    }

    /* 顶部栏 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      min-height: 36px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 顶部总览卡 */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-num {
      font-size: 13px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #10b981);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card-2);
      color: var(--muted);
    }

    .filter-chip.active {
      background: var(--primary);
      color: var(--primary-fg);
    }

    /* 阶段地图卡片 */
    .world-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .world-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .world-title {
      font-size: 15px;
      font-weight: 800;
    }

    .world-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .world-stat {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--card-2);
      white-space: nowrap;
    }

    .stage-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 620px) {
      .stage-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stage-btn {
      width: 100%;
      text-align: left;
      padding: 13px;
      border-radius: 14px;
      background: var(--card-2);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-btn:active {
      transform: scale(0.985);
    }

    .stage-btn.done {
      border-color: var(--ok);
      background: var(--ok-soft);
    }

    .stage-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-name {
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .stage-preview {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 250px;
    }

    .stage-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .stage-btn.done .stage-badge {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    /* 详情页 & 拆句工作台 */
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .formula-box {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0;
    }

    .point-list {
      margin: 8px 0 0;
      padding-left: 18px;
      font-size: 14px;
    }

    .point-list li {
      margin-bottom: 6px;
    }

    /* 交互式真题长难句拆解卡片 */
    .lab-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      margin-top: 10px;
    }

    .lab-source {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .source-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .speak-btn {
      min-width: 34px;
      min-height: 34px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sentence-display {
      font-size: 15px;
      line-height: 1.85;
      font-weight: 500;
      padding: 10px 12px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      word-break: break-word;
    }

    /* 语法成分高亮 */
    .seg-subj {
      background: var(--subj-bg);
      color: var(--subj-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 700;
    }

    .seg-verb {
      background: var(--verb-bg);
      color: var(--verb-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .seg-obj {
      background: var(--obj-bg);
      color: var(--obj-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 700;
    }

    .seg-mod {
      background: var(--mod-bg);
      color: var(--mod-fg);
      padding: 1px 5px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .seg-tag {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.9;
      margin-right: 3px;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .lab-controls {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .ctrl-btn {
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .ctrl-btn.active {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }

    .lab-analysis {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .vocab-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* 测验卡片 */
    .quiz-card {
      background: var(--card-2);
      border-radius: 14px;
      padding: 13px;
      margin-top: 10px;
    }

    .quiz-type-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .quiz-q {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.55;
    }

    .quiz-opt {
      width: 100%;
      text-align: left;
      min-height: 44px;
      padding: 10px 12px;
      margin-bottom: 7px;
      border-radius: 11px;
      background: var(--card);
      border: 1.5px solid var(--border);
      font-size: 13px;
      line-height: 1.45;
      display: block;
    }

    .quiz-opt.correct {
      border-color: var(--ok);
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 700;
    }

    .quiz-opt.wrong {
      border-color: var(--err);
      background: var(--err-soft);
      color: var(--err);
    }

    .quiz-explain {
      font-size: 12px;
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--card);
      line-height: 1.55;
    }

    .nav-footer {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-primary {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 14px;
      font-weight: 700;
      padding: 0 14px;
    }

    .btn-secondary {
      min-height: 46px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      padding: 0 14px;
    }

    .btn-primary:disabled, .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .nav-tab {
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      gap: 2px;
    }

    .nav-tab.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">CET-4 四级长难句特训</div>
        <div class="brand-sub">真题原句拆解 · 从看懵到秒懂</div>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="pill-btn">🌙 夜间</button>
        <button id="resetBtn" class="pill-btn">重置</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Tab 1: 闯关地图 -->
    <section id="viewMap">
      <div class="hero-card">
        <div class="hero-row">
          <span id="rankBadge" class="rank-badge">📄 真题新手</span>
          <span id="progressText" class="progress-num">0 / 24 关 (0%)</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;">
          每关均取材自 <strong>2023 年四级真题阅读原文</strong>：先用「主干/修饰高亮」拆句，再做主干识别与句意题通关。
        </div>
        <div class="filter-row">
          <button class="filter-chip active" data-filter="all">全部关卡 (24)</button>
          <button class="filter-chip" data-filter="todo">待攻克</button>
          <button class="filter-chip" data-filter="done">已通关</button>
        </div>
      </div>

      <div id="worldsContainer"></div>
    </section>

    <!-- 关卡详情：拆句工作台 + 真题测验 -->
    <section id="viewDetail" class="hidden"></section>

    <!-- Tab 2: 真题难句精拆库 -->
    <section id="viewBank" class="hidden"></section>

    <!-- Tab 3: 真题实战刷题 & 错题本 -->
    <section id="viewPractice" class="hidden"></section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-tab="map">
        <span style="font-size:17px">🗺️</span>
        <span>闯关特训</span>
      </button>
      <button class="nav-tab" data-tab="bank">
        <span style="font-size:17px">🔬</span>
        <span>真题拆句库</span>
      </button>
      <button class="nav-tab" data-tab="practice">
        <span style="font-size:17px">⚡</span>
        <span>刷题/错题</span>
      </button>
    </div>
  </nav>

  <script>
    // 数据结构说明：
    // segments: [{ t: "文本", k: "subj"|"verb"|"obj"|"mod"|"plain", tag?: "修饰类型" }]
    const WORLDS = [
      {
        id: "s1",
        name: "Stage 1 · 剥洋葱抓主干",
        subtitle: "破解四级第一大拦路虎：主谓被隔断、插入语与多修饰并列",
        stages: [
          {
            id: "1-1",
            title: "识别真假谓语，锁定句子心脏",
            summary: "四级长句常把非谓语动词（done / doing）或从句动词塞在主句中间，学会一眼认出真正的谓语动词（带时态/情态动词）。",
            formula: "真谓语 = 紧跟主语 + 带时态/情态/助动词；过去分词插入语(done...)、to do、doing 都不是主句谓语！",
            points: [
              "看到逗号隔开的过去分词短语（如 done for...），先整块跳过，往后找真正带时态/情态动词的谓语。",
              "当主句是「主+谓+that从句」时，先看清主句表达谁发现/认为，再进入 that 从句内部找第二套主谓。"
            ],
            labs: [
              {
                source: "2023.12 四级套1 · Section A",
                segments: [
                  { t: "Several recent studies", k: "subj" },
                  { t: "have found", k: "verb" },
                  { t: "that", k: "plain" },
                  { t: "even low-intensity exercise,", k: "subj" },
                  { t: "done for a short amount of time,", k: "mod", tag: "过去分词作定语(插入)" },
                  { t: "can have", k: "verb" },
                  { t: "a meaningful impact on health.", k: "obj" }
                ],
                zh: "近几项研究发现，即使是短时间内进行的低强度运动，也能对健康产生有意义的影响。",
                vocab: "low-intensity 低强度的 · impact 影响",
                tip: "很多同学会把 done 当成 exercise 的谓语，实际上 done 是被动分词插入修饰，真正谓语是后面的 can have。"
              },
              {
                source: "2023.06 四级套2 · 仔细阅读 Passage 2",
                segments: [
                  { t: "The traditional school year,", k: "subj" },
                  { t: "with three months of vacation every summer,", k: "mod", tag: "介词短语插入" },
                  { t: "was first implemented", k: "verb" },
                  { t: "when America was an agricultural society and the summer months were needed for farm work.", k: "mod", tag: "时间状语从句" }
                ],
                zh: "每年夏天有三个月假期的传统学年制度，最初是在美国还是农业社会、夏季月份需要人们干农活时实行的。",
                vocab: "implement 实施 · agricultural 农业的",
                tip: "主语 year 和谓语 was implemented 被 with 短语隔开，when 后面则是两个并列的时间背景分句。"
              }
            ],
            quiz: [
              {
                type: "主干抓取",
                q: "这句话中，that 从句里的真正主干是：\n「Several recent studies have found that even low-intensity exercise, done for a short amount of time, can have a meaningful impact on health.」",
                options: [
                  "studies done for a short amount of time",
                  "exercise can have a meaningful impact",
                  "short amount of time can have health",
                  "recent studies have done exercise"
                ],
                answer: 1,
                explain: "done for a short amount of time 是修饰 exercise 的分词插入语，剥离后 that 从句主干为 exercise can have a meaningful impact。"
              },
              {
                type: "真题理解",
                q: "在「The traditional school year, with three months of vacation every summer, was first implemented when America was an agricultural society...」中，传统学年制最早实行的原因是：",
                options: [
                  "美国学校缺乏空调设施",
                  "农业社会时期夏季需要农忙",
                  "学生需要三个月时间旅游",
                  "教师每年需要长假休息"
                ],
                answer: 1,
                explain: "when 从句交代了时间背景：when America was an agricultural society and the summer months were needed for farm work。"
              }
            ]
          },
          {
            id: "1-2",

    const STORAGE_DONE = "cet4_quest_done_v2";
    const STORAGE_WRONG = "cet4_quest_wrong_v2";
    const STORAGE_THEME = "cet4_quest_theme_v2";

    let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_DONE) || "[]"));
    let wrongSet = new Set(JSON.parse(localStorage.getItem(STORAGE_WRONG) || "[]"));
    let currentFilter = "all";
    let currentTab = "map";
    let activeStageId = null;
    let quizAnswers = {};
    let labModes = {}; // labKey -> { trunk: bool, mod: bool, analysis: bool }

    let practiceMode = "all"; // "all" | "wrong"
    let practiceQueue = [];
    let practiceIdx = 0;
    let practicePicked = null;

    const allStages = WORLDS.flatMap(w => w.stages.map(s => ({ ...s, worldName: w.name })));

    // 全部真题例句库 + 全部题库
    const allLabs = allStages.flatMap(s =>
      s.labs.map((lab, i) => ({ ...lab, stageId: s.id, stageTitle: s.title, key: `${s.id}-lab-${i}` }))
    );
    const allQuestions = allStages.flatMap(s =>
      s.quiz.map((q, i) => ({ ...q, stageId: s.id, stageTitle: s.title, qKey: `${s.id}-q-${i}` }))
    );

    if (localStorage.getItem(STORAGE_THEME) === "dark") {
      document.documentElement.classList.add("dark");
      document.getElementById("themeBtn").textContent = "☀️ 日间";
    }

    document.getElementById("themeBtn").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(STORAGE_THEME, isDark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = isDark ? "☀️ 日间" : "🌙 夜间";
    });

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        alert("当前浏览器不支持语音朗读");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }

    function saveState() {
      localStorage.setItem(STORAGE_DONE, JSON.stringify([...completed]));
      localStorage.setItem(STORAGE_WRONG, JSON.stringify([...wrongSet]));
    }

    function getRank(n) {
      if (n === 0) return "📄 真题新手";
      if (n < 6) return "🔍 主干猎手";
      if (n < 12) return "✂️ 从句拆解师";
      if (n < 18) return "⚡ 非谓语达人";
      if (n < 24) return "🛡️ 四级高分预备";
      return "🏆 CET-4 长难句宗师";
    }

    function renderSentenceHTML(segments, mode) {
      return segments.map(seg => {
        const txt = escapeHtml(seg.t);
        if (mode.trunk && (seg.k === "subj" || seg.k === "verb" || seg.k === "obj")) {
          return `<span class="seg-${seg.k}">${txt}</span>`;
        }
        if (mode.mod && seg.k === "mod") {
          const tag = seg.tag ? `<span class="seg-tag">[${escapeHtml(seg.tag)}]</span>` : "";
          return `<span class="seg-mod">${tag}${txt}</span>`;
        }
        return txt;
      }).join(" ");
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getLabPlainText(lab) {
      return lab.segments.map(s => s.t).join(" ");
    }

    function updateProgressUI() {
      const done = completed.size;
      const total = allStages.length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("rankBadge").textContent = getRank(done);
      document.getElementById("progressText").textContent = `${done} / ${total} 关 (${pct}%)`;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function renderMap() {
      updateProgressUI();
      const container = document.getElementById("worldsContainer");
      container.innerHTML = "";

      WORLDS.forEach(world => {
        const list = world.stages.filter(s => {
          if (currentFilter === "done") return completed.has(s.id);
          if (currentFilter === "todo") return !completed.has(s.id);
          return true;
        });
        if (!list.length) return;

        const doneCount = world.stages.filter(s => completed.has(s.id)).length;
        const card = document.createElement("div");
        card.className = "world-card";
        card.innerHTML = `
          <div class="world-head">
            <div>
              <div class="world-title">${world.name}</div>
              <div class="world-sub">${world.subtitle}</div>
            </div>
            <div class="world-stat">${doneCount}/${world.stages.length}</div>
          </div>
          <div class="stage-list"></div>
        `;

        const stageList = card.querySelector(".stage-list");
        list.forEach(stage => {
          const isDone = completed.has(stage.id);
          const btn = document.createElement("button");
          btn.className = `stage-btn ${isDone ? "done" : ""}`;
          btn.innerHTML = `
            <div style="min-width:0">
              <div class="stage-meta">
                <span>关卡 ${stage.id}</span>
                <span>•</span>
                <span>${stage.labs.length} 句真题精拆</span>
              </div>
              <div class="stage-name">${stage.title}</div>
              <div class="stage-preview">${stage.labs[0].source}</div>
            </div>
            <div class="stage-badge">${isDone ? "✓" : "→"}</div>
          `;
          btn.addEventListener("click", () => openDetail(stage.id));
          stageList.appendChild(btn);
        });

        container.appendChild(card);
      });

      if (!container.children.length) {
        container.innerHTML = `<div class="world-card" style="text-align:center;color:var(--muted);font-size:14px;">当前筛选条件下暂无关卡</div>`;
      }
    }

    function renderLabCard(lab, labKey) {
      const mode = labModes[labKey] || { trunk: true, mod: true, analysis: false };
      labModes[labKey] = mode;

      return `
        <div class="lab-card" data-labkey="${labKey}">
          <div class="lab-source">
            <span class="source-tag">${lab.source}</span>
            <button class="speak-btn" data-speak-key="${labKey}" aria-label="朗读真题原句">🔊</button>
          </div>

          <div class="sentence-display">${renderSentenceHTML(lab.segments, mode)}</div>

          <div class="legend-bar">
            <span class="seg-subj">主语</span>
            <span class="seg-verb">核心谓语</span>
            <span class="seg-obj">宾语/表语</span>
            <span class="seg-mod">[修饰/从句]</span>
          </div>

          <div class="lab-controls">
            <button class="ctrl-btn ${mode.trunk ? "active" : ""}" data-toggle="trunk" data-key="${labKey}">
              ${mode.trunk ? "✓ 标出主干" : "标出主干"}
            </button>
            <button class="ctrl-btn ${mode.mod ? "active" : ""}" data-toggle="mod" data-key="${labKey}">
              ${mode.mod ? "✓ 切分修饰" : "切分修饰"}
            </button>
            <button class="ctrl-btn ${mode.analysis ? "active" : ""}" data-toggle="analysis" data-key="${labKey}">
              ${mode.analysis ? "隐藏译文与点拨" : "👁️ 看译文与考点"}
            </button>
          </div>

          ${mode.analysis ? `
            <div class="lab-analysis">
              <div><strong>📖 参考译文：</strong>${lab.zh}</div>
              <div style="margin-top:6px;"><strong>🎯 拆句点拨：</strong>${lab.tip}</div>
              <div class="vocab-list"><strong>📚 真题词汇：</strong>${lab.vocab}</div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function bindLabEvents(root, labsMap, rerenderFn) {
      root.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.key;
          const field = btn.dataset.toggle;
          if (!labModes[key]) labModes[key] = { trunk: true, mod: true, analysis: false };
          labModes[key][field] = !labModes[key][field];
          rerenderFn();
        });
      });

      root.querySelectorAll("[data-speak-key]").forEach(btn => {
        btn.addEventListener("click", () => {
          const lab = labsMap[btn.dataset.speakKey];
          if (lab) speak(getLabPlainText(lab));
        });
      });
    }

    function openDetail(stageId) {
      activeStageId = stageId;
      document.getElementById("viewMap").classList.add("hidden");
      document.getElementById("viewDetail").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderDetail();
    }

    function closeDetail() {
      activeStageId = null;
      document.getElementById("viewDetail").classList.add("hidden");
      document.getElementById("viewMap").classList.remove("hidden");
      renderMap();
    }

    function renderDetail() {
      const idx = allStages.findIndex(s => s.id === activeStageId);
      const stage = allStages[idx];
      if (!stage) return;

      const isDone = completed.has(stage.id);
      const prev = idx > 0 ? allStages[idx - 1] : null;
      const next = idx < allStages.length - 1 ? allStages[idx + 1] : null;
      const pickedMap = quizAnswers[stage.id] || {};

      const labsMap = {};
      stage.labs.forEach((lab, i) => {
        labsMap[`${stage.id}-lab-${i}`] = lab;
      });

      const el = document.getElementById("viewDetail");
      el.innerHTML = `
        <button class="detail-back" id="backMapBtn">← 返回闯关路线</button>

        <div class="section-box">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <div style="font-size:12px;color:var(--muted);">${stage.worldName}</div>
              <h2 style="margin:4px 0 0;font-size:18px;font-weight:800;">关卡 ${stage.id} · ${stage.title}</h2>
            </div>
            <button id="toggleStageBtn" class="pill-btn" style="${isDone ? "background:var(--ok-soft);color:var(--ok);border-color:var(--ok);" : "background:var(--primary);color:#fff;border-color:var(--primary);"}">
              ${isDone ? "✓ 已通关" : "标记通关"}
            </button>
          </div>
          <p style="margin:10px 0 0;font-size:14px;">${stage.summary}</p>
          <div class="formula-box">💡 破句心法：${stage.formula}</div>
          <ul class="point-list">
            ${stage.points.map(p => `<li>${p}</li>`).join("")}
          </ul>
        </div>

        <div class="section-box">
          <div style="font-size:15px;font-weight:800;">🔬 四级真题拆句工作台</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">先点掉「标出主干 / 切分修饰」盲读一遍，再打开高亮与译文对照！</div>
          ${stage.labs.map((lab, i) => renderLabCard(lab, `${stage.id}-lab-${i}`)).join("")}
        </div>

        <div class="section-box">
          <div style="font-size:15px;font-weight:800;">🎯 通关实战检验（全部答对自动过关）</div>
          ${stage.quiz.map((q, qIdx) => {
            const picked = pickedMap[qIdx];
            const answered = picked !== undefined;
            const isCorrect = picked === q.answer;
            return `
              <div class="quiz-card">
                <span class="quiz-type-badge">[${q.type}]</span>
                <div class="quiz-q">${qIdx + 1}. ${escapeHtml(q.q).replace(/\n/g, "<br>")}</div>
                ${q.options.map((opt, oIdx) => {
                  let cls = "";
                  if (answered) {
                    if (oIdx === q.answer) cls = "correct";
                    else if (oIdx === picked) cls = "wrong";
                  }
                  return `<button class="quiz-opt ${cls}" data-q="${qIdx}" data-o="${oIdx}">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
                }).join("")}
                ${answered ? `<div class="quiz-explain" style="color:${isCorrect ? "var(--ok)" : "var(--err)"}">${isCorrect ? "✅ 过关！" : "❌ 思路纠正："} ${q.explain}</div>` : ""}
              </div>
            `;
          }).join("")}

          <div class="nav-footer">
            <button class="btn-secondary" id="prevStageBtn" ${!prev ? "disabled" : ""}>← 上一关</button>
            <button class="btn-primary" id="nextStageBtn" ${!next ? "disabled" : ""}>下一关 ${next ? `(${next.id})` : ""} →</button>
          </div>
        </div>
      `;

      document.getElementById("backMapBtn").addEventListener("click", closeDetail);
      document.getElementById("toggleStageBtn").addEventListener("click", () => {
        if (completed.has(stage.id)) completed.delete(stage.id);
        else completed.add(stage.id);
        saveState();
        updateProgressUI();
        renderDetail();
      });

      bindLabEvents(el, labsMap, renderDetail);

      el.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const qIdx = Number(btn.dataset.q);
          const oIdx = Number(btn.dataset.o);
          const qObj = stage.quiz[qIdx];
          const qKey = `${stage.id}-q-${qIdx}`;

          if (!quizAnswers[stage.id]) quizAnswers[stage.id] = {};
          quizAnswers[stage.id][qIdx] = oIdx;

          if (oIdx === qObj.answer) wrongSet.delete(qKey);
          else wrongSet.add(qKey);

          const allRight = stage.quiz.every((q, i) => quizAnswers[stage.id][i] === q.answer);
          if (allRight) completed.add(stage.id);

          saveState();
          updateProgressUI();
          renderDetail();
        });
      });

      if (prev) document.getElementById("prevStageBtn").addEventListener("click", () => openDetail(prev.id));
      if (next) document.getElementById("nextStageBtn").addEventListener("click", () => openDetail(next.id));
    }

    // Tab 2: 真题拆句库
    let bankSearch = "";
    function renderBank() {
      const box = document.getElementById("viewBank");
      const filtered = allLabs.filter(l => {
        if (!bankSearch.trim()) return true;
        const kw = bankSearch.trim().toLowerCase();
        return getLabPlainText(l).toLowerCase().includes(kw) || l.source.toLowerCase().includes(kw) || l.stageTitle.toLowerCase().includes(kw);
      });

      const labsMap = {};
      filtered.forEach(l => { labsMap[l.key] = l; });

      box.innerHTML = `
        <div class="hero-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div>
              <div style="font-size:16px;font-weight:800;">🔬 2023 四级真题长难句精拆库</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">共收录 ${allLabs.length} 句真实四级阅读真题长难句，可一键切换“盲读 / 主干 / 修饰”模式。</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button id="blindAllBtn" class="pill-btn">🙈 全部盲读</button>
              <button id="showAllBtn" class="pill-btn">🔍 全部标亮</button>
            </div>
          </div>
          <input id="bankSearchInput" type="search" value="${escapeHtml(bankSearch)}" placeholder="搜索真题年份、关键词（如 which / 2023.12 /倒装）..." style="width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:13px;" />
        </div>
        ${filtered.map(l => `
          <div class="section-box" style="padding:12px 14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;">
              <span style="font-size:12px;color:var(--muted);font-weight:700;">关卡 ${l.stageId} · ${l.stageTitle}</span>
              <button class="pill-btn" data-jump="${l.stageId}">去这关 →</button>
            </div>
            ${renderLabCard(l, l.key)}
          </div>
        `).join("")}
      `;

      document.getElementById("bankSearchInput").addEventListener("input", e => {
        bankSearch = e.target.value;
        renderBank();
      });

      document.getElementById("blindAllBtn").addEventListener("click", () => {
        filtered.forEach(l => { labModes[l.key] = { trunk: false, mod: false, analysis: false }; });
        renderBank();
      });

      document.getElementById("showAllBtn").addEventListener("click", () => {
        filtered.forEach(l => { labModes[l.key] = { trunk: true, mod: true, analysis: true }; });
        renderBank();
      });

      box.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab("map");
          openDetail(btn.dataset.jump);
        });
      });

      bindLabEvents(box, labsMap, renderBank);
    }

    // Tab 3: 刷题与错题本
    function initPractice(mode) {
      practiceMode = mode;
      if (mode === "wrong") {
        practiceQueue = allQuestions.filter(q => wrongSet.has(q.qKey));
      } else {
        practiceQueue = [...allQuestions].sort(() => Math.random() - 0.5);
      }
      practiceIdx = 0;
      practicePicked = null;
      renderPractice();
    }

    function renderPractice() {
      const box = document.getElementById("viewPractice");
      const wrongCount = wrongSet.size;

      const headerHTML = `
        <div class="hero-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div style="font-size:16px;font-weight:800;">⚡ 四级长难句实战刷题</div>
            <span style="font-size:12px;color:var(--muted);">当前错题本：<strong>${wrongCount}</strong> 题</span>
          </div>
          <div class="filter-row">
            <button class="filter-chip ${practiceMode === "all" ? "active" : ""}" id="modeAllBtn">🎲 全库随机 (${allQuestions.length})</button>
            <button class="filter-chip ${practiceMode === "wrong" ? "active" : ""}" id="modeWrongBtn">📕 只刷错题 (${wrongCount})</button>
          </div>
        </div>
      `;

      if (!practiceQueue.length) {
        box.innerHTML = `
          ${headerHTML}
          <div class="section-box" style="text-align:center;padding:28px 16px;">
            <div style="font-size:28px;">🎉</div>
            <div style="font-size:15px;font-weight:700;margin-top:6px;">错题本目前为空！</div>
            <div style="font-size:13px;color:var(--muted);margin-top:4px;">做错的题目会自动收入这里，做对后会自动移出。</div>
            <button class="btn-primary" id="goAllPracticeBtn" style="margin-top:14px;max-width:220px;">切回全库随机刷题</button>
          </div>
        `;
        document.getElementById("modeAllBtn").addEventListener("click", () => initPractice("all"));
        document.getElementById("modeWrongBtn").addEventListener("click", () => initPractice("wrong"));
        document.getElementById("goAllPracticeBtn").addEventListener("click", () => initPractice("all"));
        return;
      }

      const item = practiceQueue[practiceIdx];
      const answered = practicePicked !== null;
      const isCorrect = practicePicked === item.answer;

      box.innerHTML = `
        ${headerHTML}
        <div class="section-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="source-tag">关卡 ${item.stageId} · ${item.stageTitle}</span>
            <span style="font-size:12px;color:var(--muted);">${practiceIdx + 1} / ${practiceQueue.length}</span>
          </div>
          <div class="quiz-card">
            <span class="quiz-type-badge">[${item.type}]</span>
            <div class="quiz-q">${escapeHtml(item.q).replace(/\n/g, "<br>")}</div>
            ${item.options.map((opt, oIdx) => {
              let cls = "";
              if (answered) {
                if (oIdx === item.answer) cls = "correct";
                else if (oIdx === practicePicked) cls = "wrong";
              }
              return `<button class="quiz-opt ${cls}" data-po="${oIdx}">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
            }).join("")}
            ${answered ? `<div class="quiz-explain" style="color:${isCorrect ? "var(--ok)" : "var(--err)"}">${isCorrect ? "✅ 答对了！" : "❌ 已自动记入错题本："} ${item.explain}</div>` : ""}
          </div>
          <div class="nav-footer">
            <button class="btn-secondary" id="reshuffleBtn">重新洗牌</button>
            <button class="btn-primary" id="nextPracticeBtn">下一题 →</button>
          </div>
        </div>
      `;

      document.getElementById("modeAllBtn").addEventListener("click", () => initPractice("all"));
      document.getElementById("modeWrongBtn").addEventListener("click", () => initPractice("wrong"));

      box.querySelectorAll("[data-po]").forEach(btn => {
        btn.addEventListener("click", () => {
          practicePicked = Number(btn.dataset.po);
          if (practicePicked === item.answer) wrongSet.delete(item.qKey);
          else wrongSet.add(item.qKey);
          saveState();
          renderPractice();
        });
      });

      document.getElementById("reshuffleBtn").addEventListener("click", () => initPractice(practiceMode));
      document.getElementById("nextPracticeBtn").addEventListener("click", () => {
        if (practiceMode === "wrong") {
          practiceQueue = allQuestions.filter(q => wrongSet.has(q.qKey));
          if (!practiceQueue.length) {
            practiceIdx = 0;
          } else {
            practiceIdx = (practiceIdx + 1) % practiceQueue.length;
          }
        } else {
          practiceIdx = (practiceIdx + 1) % practiceQueue.length;
        }
        practicePicked = null;
        renderPractice();
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".nav-tab").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      document.getElementById("viewMap").classList.toggle("hidden", tab !== "map");
      document.getElementById("viewDetail").classList.add("hidden");
      document.getElementById("viewBank").classList.toggle("hidden", tab !== "bank");
      document.getElementById("viewPractice").classList.toggle("hidden", tab !== "practice");

      if (tab === "map") renderMap();
      if (tab === "bank") renderBank();
      if (tab === "practice") {
        if (!practiceQueue.length) initPractice(practiceMode);
        else renderPractice();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        currentFilter = chip.dataset.filter;
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c === chip));
        renderMap();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确定要清空所有通关进度和错题记录吗？")) return;
      completed.clear();
      wrongSet.clear();
      quizAnswers = {};
      saveState();
      if (activeStageId) renderDetail();
      else renderMap();
    });

    renderMap();
  </script>
</body>
</html>
