<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>零基础直通四级长难句 · 闯关特训</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --primary-fg: #ffffff;
      --ok: #059669;
      --ok-soft: rgba(5, 150, 105, 0.12);
      --err: #dc2626;
      --err-soft: rgba(220, 38, 38, 0.12);
      --subj-bg: rgba(37, 99, 235, 0.14);
      --subj-fg: #1d4ed8;
      --verb-bg: rgba(220, 38, 38, 0.14);
      --verb-fg: #b91c1c;
      --obj-bg: rgba(5, 150, 105, 0.14);
      --obj-fg: #047857;
      --mod-bg: rgba(100, 116, 139, 0.12);
      --mod-fg: #475569;
      --shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
      --radius: 16px;
    }

    html.dark {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #263244;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-fg: #ffffff;
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.16);
      --err: #f87171;
      --err-soft: rgba(248, 113, 113, 0.16);
      --subj-bg: rgba(96, 165, 250, 0.22);
      --subj-fg: #93c5fd;
      --verb-bg: rgba(248, 113, 113, 0.22);
      --verb-fg: #fca5a5;
      --obj-bg: rgba(52, 211, 153, 0.2);
      --obj-fg: #6ee7b7;
      --mod-bg: rgba(148, 163, 184, 0.16);
      --mod-fg: #cbd5e1;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 14px 24px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      min-height: 34px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hero-card, .world-card, .section-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
      margin-bottom: 13px;
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-num {
      font-size: 13px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #10b981);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card-2);
      color: var(--muted);
    }

    .filter-chip.active {
      background: var(--primary);
      color: var(--primary-fg);
    }

    .world-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .world-title {
      font-size: 15px;
      font-weight: 800;
    }

    .world-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .world-stat {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--card-2);
      white-space: nowrap;
    }

    .stage-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 620px) {
      .stage-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stage-btn {
      width: 100%;
      text-align: left;
      padding: 13px;
      border-radius: 14px;
      background: var(--card-2);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-btn:active {
      transform: scale(0.985);
    }

    .stage-btn.done {
      border-color: var(--ok);
      background: var(--ok-soft);
    }

    .stage-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stage-name {
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .stage-preview {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .stage-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .stage-btn.done .stage-badge {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* 3 阶句子生长 */
    .evo-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
    }

    .evo-step {
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .evo-step:last-child {
      margin-bottom: 0;
    }

    .evo-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .point-list {
      margin: 8px 0 0;
      padding-left: 18px;
      font-size: 14px;
    }

    .point-list li {
      margin-bottom: 6px;
    }

    /* 词汇卡 */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    @media (min-width: 580px) {
      .vocab-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .vocab-card {
      text-align: left;
      padding: 10px;
      border-radius: 11px;
      background: var(--card-2);
      border: 1px solid var(--border);
    }

    .vocab-card:active {
      transform: scale(0.98);
    }

    /* 拆句工作台 */
    .lab-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
    }

    .lab-source {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .source-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .speak-btn {
      min-width: 34px;
      min-height: 34px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sentence-display {
      font-size: 15px;
      line-height: 1.9;
      font-weight: 500;
      padding: 11px 12px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      word-break: break-word;
      cursor: pointer;
    }

    .tap-hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .chunk-span {
      cursor: pointer;
      border-radius: 5px;
      padding: 1px 2px;
    }

    .seg-picked {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    /* 双语字幕对照模式 */
    .bilingual-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 6px;
      align-items: flex-start;
    }

    .bi-chunk {
      display: inline-flex;
      flex-direction: column;
      padding: 4px 7px;
      border-radius: 9px;
      background: var(--card-2);
      border: 1px solid var(--border);
      cursor: pointer;
      max-width: 100%;
    }

    .bi-en {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      border-radius: 4px;
      padding: 0 3px;
    }

    .bi-zh {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.35;
    }

    /* 词块弹窗条 */
    .chunk-popup {
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--card);
      border: 1.5px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .seg-subj {
      background: var(--subj-bg);
      color: var(--subj-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 700;
    }

    .seg-verb {
      background: var(--verb-bg);
      color: var(--verb-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .seg-obj {
      background: var(--obj-bg);
      color: var(--obj-fg);
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: 700;
    }

    .seg-mod {
      background: var(--mod-bg);
      color: var(--mod-fg);
      padding: 1px 5px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .seg-tag {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.9;
      margin-right: 3px;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .lab-controls {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 9px;
    }

    .ctrl-btn {
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .ctrl-btn.active {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }

    .lab-analysis {
      margin-top: 9px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13.5px;
      line-height: 1.6;
    }

    /* 测验 */
    .quiz-card {
      background: var(--card-2);
      border-radius: 14px;
      padding: 13px;
      margin-top: 10px;
    }

    .quiz-type-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .quiz-q {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.55;
    }

    .quiz-opt {
      width: 100%;
      text-align: left;
      min-height: 44px;
      padding: 10px 12px;
      margin-bottom: 7px;
      border-radius: 11px;
      background: var(--card);
      border: 1.5px solid var(--border);
      font-size: 13px;
      line-height: 1.45;
      display: block;
    }

    .quiz-opt.correct {
      border-color: var(--ok);
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 700;
    }

    .quiz-opt.wrong {
      border-color: var(--err);
      background: var(--err-soft);
      color: var(--err);
    }

    .quiz-explain {
      font-size: 12.5px;
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--card);
      line-height: 1.55;
    }

    .nav-footer {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-primary {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 14px;
      font-weight: 700;
      padding: 0 14px;
    }

    .btn-secondary {
      min-height: 46px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      padding: 0 14px;
    }

    .btn-primary:disabled, .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .nav-tab {
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      gap: 2px;
    }

    .nav-tab.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">零基础直通四级长难句</div>
        <div class="brand-sub">5 阶段 20 章 · 80 句双语精拆 · 100 题实战</div>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="pill-btn">🌙 夜间</button>
        <button id="resetBtn" class="pill-btn">重置</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="viewMap">
      <div class="hero-card">
        <div class="hero-row">
          <span id="rankBadge" class="rank-badge">🌱 零基础起跑</span>
          <span id="progressText" class="progress-num">0 / 20 章 (0%)</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:8px;">
          专为零基础备考四级打造：每章先学<strong>短句骨架 → 词汇扫盲 → 逐块双语拆解真题原句 → 5 题过关</strong>。
        </div>
        <div class="filter-row">
          <button class="filter-chip active" data-filter="all">全部章节 (20)</button>
          <button class="filter-chip" data-filter="todo">未通关</button>
          <button class="filter-chip" data-filter="done">已通关</button>
        </div>
      </div>

      <div id="worldsContainer"></div>
    </section>

    <section id="viewDetail" class="hidden"></section>
    <section id="viewBank" class="hidden"></section>
    <section id="viewPractice" class="hidden"></section>
  </main>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-tab="map">
        <span style="font-size:17px">🗺️</span>
        <span>闯关学习</span>
      </button>
      <button class="nav-tab" data-tab="bank">
        <span style="font-size:17px">🔬</span>
        <span>80句双语库</span>
      </button>
      <button class="nav-tab" data-tab="practice">
        <span style="font-size:17px">⚡</span>
        <span>100题/错题</span>
      </button>
    </div>
  </nav>

  <script src="./data-1.js"></script>
  <script src="./data-2.js"></script>
  <script src="./data-3.js"></script>
  <script src="./app.js"></script>
</body>
</html>
