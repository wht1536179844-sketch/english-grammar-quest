<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>英语语法闯关训练 · 从零到精通</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --primary-fg: #ffffff;
      --ok: #10b981;
      --ok-soft: rgba(16, 185, 129, 0.12);
      --err: #ef4444;
      --err-soft: rgba(239, 68, 68, 0.12);
      --warn: #f59e0b;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      --radius: 16px;
    }

    html.dark {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #263244;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-fg: #ffffff;
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, 0.16);
      --err: #f87171;
      --err-soft: rgba(248, 113, 113, 0.16);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: calc(78px + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 14px 20px;
    }

    /* 顶部栏 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 10px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      min-height: 36px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 进度卡 */
    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-num {
      font-size: 14px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #10b981);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card-2);
      color: var(--muted);
      border: 1px solid transparent;
    }

    .filter-chip.active {
      background: var(--primary);
      color: var(--primary-fg);
    }

    /* 世界卡片 */
    .world-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .world-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .world-title {
      font-size: 15px;
      font-weight: 800;
    }

    .world-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .world-stat {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--card-2);
      white-space: nowrap;
    }

    .stage-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .stage-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stage-btn {
      width: 100%;
      text-align: left;
      padding: 13px;
      border-radius: 14px;
      background: var(--card-2);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .stage-btn:active {
      transform: scale(0.985);
    }

    .stage-btn.done {
      border-color: var(--ok);
      background: var(--ok-soft);
    }

    .stage-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-name {
      font-size: 14px;
      font-weight: 700;
      margin-top: 3px;
    }

    .stage-video {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }

    .stage-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .stage-btn.done .stage-badge {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    /* 关卡详情页 */
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .formula-box {
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      margin: 12px 0;
      word-break: break-word;
    }

    .point-list {
      margin: 8px 0 0;
      padding-left: 18px;
      font-size: 14px;
    }

    .point-list li {
      margin-bottom: 6px;
    }

    .example-item {
      background: var(--card-2);
      border-radius: 12px;
      padding: 11px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .speak-btn {
      min-width: 38px;
      min-height: 38px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quiz-card {
      background: var(--card-2);
      border-radius: 14px;
      padding: 13px;
      margin-top: 10px;
    }

    .quiz-q {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .quiz-opt {
      width: 100%;
      text-align: left;
      min-height: 44px;
      padding: 10px 12px;
      margin-bottom: 7px;
      border-radius: 11px;
      background: var(--card);
      border: 1.5px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      display: block;
    }

    .quiz-opt.correct {
      border-color: var(--ok);
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 700;
    }

    .quiz-opt.wrong {
      border-color: var(--err);
      background: var(--err-soft);
      color: var(--err);
    }

    .quiz-explain {
      font-size: 12px;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--card);
    }

    .nav-footer {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-primary {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 14px;
      font-weight: 700;
      padding: 0 14px;
    }

    .btn-secondary {
      min-height: 46px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      padding: 0 14px;
    }

    .btn-primary:disabled, .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 底部导航栏（手机单手友好） */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    }

    .bottom-nav-inner {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .nav-tab {
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      gap: 2px;
    }

    .nav-tab.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .hidden {
      display: none !important;
    }

    .tag-video {
      font-size: 12px;
      color: var(--muted);
      background: var(--card-2);
      padding: 8px 10px;
      border-radius: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">英语语法闯关训练</div>
        <div class="brand-sub">8 大世界 · 32 关从零到精通</div>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="pill-btn" aria-label="切换主题">🌙 夜间</button>
        <button id="resetBtn" class="pill-btn">重置</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Tab 1: 闯关地图 -->
    <section id="viewMap">
      <div class="hero-card">
        <div class="hero-row">
          <span id="rankBadge" class="rank-badge">🌱 语法新手</span>
          <span id="progressText" class="progress-num">0 / 32 关 (0%)</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="filter-row">
          <button class="filter-chip active" data-filter="all">全部关卡</button>
          <button class="filter-chip" data-filter="todo">未通关</button>
          <button class="filter-chip" data-filter="done">已通关</button>
        </div>
      </div>

      <div id="worldsContainer"></div>
    </section>

    <!-- 关卡详情视图（点击任意关卡进入） -->
    <section id="viewDetail" class="hidden"></section>

    <!-- Tab 2: 随机刷题 / 错题巩固 -->
    <section id="viewPractice" class="hidden"></section>

    <!-- Tab 3: 万能公式速查 -->
    <section id="viewCheat" class="hidden"></section>
  </main>

  <!-- 底部手机导航 -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-tab="map">
        <span style="font-size:17px">🗺️</span>
        <span>闯关地图</span>
      </button>
      <button class="nav-tab" data-tab="practice">
        <span style="font-size:17px">🎯</span>
        <span>随机刷题</span>
      </button>
      <button class="nav-tab" data-tab="cheat">
        <span style="font-size:17px">📖</span>
        <span>公式速查</span>
      </button>
    </div>
  </nav>

  <script>
    const WORLDS = [
      {
        id: "w1",
        name: "World 1 · 新手村：句子最小积木",
        subtitle: "代词、be动词、名词与五大基本句型",
        stages: [
          {
            id: "1-1",
            title: "人称代词与单三概念",
            video: "第 1 集《你、我、他(包括单三讲解)》",
            summary: "分清主格（作主语）与宾格（作宾语），彻底搞懂英语中最容易丢分的「第三人称单数」。",
            formula: "主格 (I/you/he/she/it/we/they) + 动词 + 宾格 (me/you/him/her/it/us/them)",
            points: [
              "主格放在动词前面发动作：He likes me.",
              "宾格放在动词或介词后面接动作：Look at him.",
              "第三人称单数（单三）：非你非我且只有一个（he/she/it/Tom），一般现在时动词要加 -s/-es。"
            ],
            examples: [
              { en: "She teaches us English.", zh: "她教我们英语。（She 主格，teaches 单三，us 宾格）" },
              { en: "Listen to me, please.", zh: "请听我说。（介词 to 后用宾格 me）" }
            ],
            quiz: [
              {
                q: "选出正确句子：「他每天帮助我。」",
                options: ["He help me every day.", "He helps I every day.", "He helps me every day.", "Him helps me every day."],
                answer: 2,
                explain: "He 是第三人称单数主格，动词 help 变 helps；动词后用宾格 me。"
              },
              {
                q: "「我和他都是学生」英文主语部分应为：",
                options: ["Me and him", "He and I", "Him and I", "I and he"],
                answer: 1,
                explain: "作主语必须用主格，习惯上把其他人称放在 I 前面，即 He and I。"
              }
            ]
          },
          {
            id: "1-2",
            title: "物主代词：你的、我的、他的",
            video: "第 2 集《你的、我的、他的（形容词）》+ 补1",
            summary: "区分「形容词性物主代词」（后面必须跟名词）与「名词性物主代词」（单独使用 = 形物代 + 名词）。",
            formula: "形物代 (my/your/his/her...) + 名词  =  名物代 (mine/yours/his/hers...)",
            points: [
              "形物代不能单独使用，后面必须带名词：my book。",
              "名物代自带名词属性，后面绝不再加名词：This book is mine."
            ],
            examples: [
              { en: "This is her phone, not yours.", zh: "这是她的手机，不是你的。" },
              { en: "Their classroom is bigger than ours.", zh: "他们的教室比我们的更大。" }
            ],
            quiz: [
              {
                q: "That bike is _____, not _____.",
                options: ["my; your", "mine; yours", "mine; your", "my; yours"],
                answer: 1,
                explain: "两处后面都没有名词，都需要用名词性物主代词 mine 和 yours。"
              }
            ]
          },
          {
            id: "1-3",
            title: "be 动词的本质与用法",
            video: "第 3 集《be动词基本用法》",
            summary: "记住「我用 am，你用 are，is 连着他她它，复数全用 are」。be 动词表示「是 / 在 / 处于某种状态」。",
            formula: "主语 + am / is / are (过去式 was / were) + 名词 / 形容词 / 介词短语",
            points: [
              "中文里「我很高」没有「是」，但英文必须有动词：I am tall.",
              "句子里已有实义动词作谓语时，不要乱加 be 动词（❌ I am like apples）。"
            ],
            examples: [
              { en: "They are in the library.", zh: "他们在图书馆里。" },
              { en: "She was very tired yesterday.", zh: "她昨天很累。" }
            ],
            quiz: [
              {
                q: "下列哪个句子语法完全正确？",
                options: ["I am very happy.", "I very happy.", "She is work hard.", "They was at home."],
                answer: 0,
                explain: "happy 是形容词，需要 be 动词连接；C 多了 is；D 主语复数应用 were。"
              }
            ]
          },
          {
            id: "1-4",
            title: "名词、冠词与五大基本句型",
            video: "体系补全（零基础必学骨架）",
            summary: "所有英语句子无论多长，骨架永远逃不出「五大基本句型」，再配上可数/不可数名词与冠词 a/an/the。",
            formula: "1.主谓(SV)  2.主谓宾(SVO)  3.主系表(SVP)  4.主谓双宾(SVOO)  5.主谓宾补(SVOC)",
            points: [
              "可数名词单数不能裸奔，前面通常要有 a/an/the/my 等限定词。",
              "a/an 看发音不看字母：an hour（h不发音），a university（u发/j/辅音）。",
              "the 表特指（双方都知道或前文提过的）。"
            ],
            examples: [
              { en: "He gave me a useful book.", zh: "他给了我一本有用的书。（SVOO）" },
              { en: "The news made us happy.", zh: "这个消息让我们很开心。（SVOC）" }
            ],
            quiz: [
              {
                q: "He is _____ honest boy.",
                options: ["a", "an", "the", "/"],
                answer: 1,
                explain: "honest 中 h 不发音，以元音音素开头，泛指一个诚实的男孩用 an。"
              }
            ]
          }
        ]
      },
      {
        id: "w2",
        name: "World 2 · 句型工坊：造句三大变形术",
        subtitle: "一般疑问句、特殊疑问句、否定句、祈使与感叹",
        stages: [
          {
            id: "2-1",
            title: "一般疑问句的底层原理",
            video: "第 4 集《一般疑问句的底层原理》",
            summary: "一句话变一般疑问句：「有 be 提 be，有情提情，无 be 无情请助动（do/does/did），动词现原形」。",
            formula: "Be / 情态动词 / Do(Does/Did) + 主语 + 动词原形... ?",
            points: [
              "助动词 do/does/did 把时态和单三吸走，后面的实义动词必须恢复原形！",
              "例：He likes coffee. → Does he like coffee?"
            ],
            examples: [
              { en: "Did you finish your homework?", zh: "你完成作业了吗？" },
              { en: "Can she swim?", zh: "她会游泳吗？" }
            ],
            quiz: [
              {
                q: "将「She went to Beijing yesterday.」改为一般疑问句：",
                options: ["Did she went to Beijing yesterday?", "Does she go to Beijing yesterday?", "Did she go to Beijing yesterday?", "Was she go to Beijing yesterday?"],
                answer: 2,
                explain: "went 是过去式实义动词，请助动词 Did 提前，went 恢复原形 go。"
              }
            ]
          },
          {
            id: "2-2",
            title: "特殊疑问句的底层原理",
            video: "第 5 集《特殊疑问句的底层原理》",
            summary: "特殊疑问句 = 特殊疑问词（what/where/when/who/why/how） + 一般疑问句语序（对主语提问除外）。",
            formula: "疑问词 + 一般疑问句（对主语提问除外：Who + 谓语...）",
            points: [
              "先确定要问什么，再把后面变成一般疑问句语序：Where do you live?",
              "对主语提问直接用陈述语序：Who broke the window?"
            ],
            examples: [
              { en: "Why did he leave early?", zh: "他为什么这么早离开？" },
              { en: "Who broke the window?", zh: "谁打破了窗户？" }
            ],
            quiz: [
              {
                q: "「你住在哪里？」正确的英文是：",
                options: ["Where you live?", "Where are you live?", "Where do you live?", "Where does you live?"],
                answer: 2,

    const STORAGE_KEY = "gq_mobile_done_v1";
    const THEME_KEY = "gq_mobile_theme_v1";

    let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentFilter = "all";
    let currentTab = "map";
    let activeStageId = null;
    let quizAnswers = {};
    let practiceQueue = [];
    let practiceIdx = 0;
    let practicePicked = null;

    const allStages = WORLDS.flatMap(w => w.stages.map(s => ({ ...s, worldName: w.name })));

    // 主题初始化
    if (localStorage.getItem(THEME_KEY) === "dark") {
      document.documentElement.classList.add("dark");
      document.getElementById("themeBtn").textContent = "☀️ 日间";
    }

    document.getElementById("themeBtn").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = isDark ? "☀️ 日间" : "🌙 夜间";
    });

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        alert("当前浏览器不支持语音朗读");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.92;
      window.speechSynthesis.speak(utter);
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
    }

    function getRank(n) {
      if (n === 0) return "🌱 语法新手";
      if (n < 8) return "🗡️ 句型学徒";
      if (n < 16) return "🛡️ 时态剑士";
      if (n < 24) return "🔮 从句法师";
      if (n < 32) return "👑 修饰大师";
      return "🏆 英语语法宗师";
    }

    function updateProgressUI() {
      const done = completed.size;
      const total = allStages.length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("rankBadge").textContent = getRank(done);
      document.getElementById("progressText").textContent = `${done} / ${total} 关 (${pct}%)`;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function renderMap() {
      updateProgressUI();
      const container = document.getElementById("worldsContainer");
      container.innerHTML = "";

      WORLDS.forEach(world => {
        const list = world.stages.filter(s => {
          if (currentFilter === "done") return completed.has(s.id);
          if (currentFilter === "todo") return !completed.has(s.id);
          return true;
        });
        if (!list.length) return;

        const doneCount = world.stages.filter(s => completed.has(s.id)).length;
        const card = document.createElement("div");
        card.className = "world-card";
        card.innerHTML = `
          <div class="world-head">
            <div>
              <div class="world-title">${world.name}</div>
              <div class="world-sub">${world.subtitle}</div>
            </div>
            <div class="world-stat">${doneCount}/${world.stages.length}</div>
          </div>
          <div class="stage-list"></div>
        `;

        const stageList = card.querySelector(".stage-list");
        list.forEach(stage => {
          const isDone = completed.has(stage.id);
          const btn = document.createElement("button");
          btn.className = `stage-btn ${isDone ? "done" : ""}`;
          btn.innerHTML = `
            <div style="min-width:0">
              <div class="stage-meta">
                <span>关卡 ${stage.id}</span>
                <span>•</span>
                <span>${isDone ? "已通关" : "去学习"}</span>
              </div>
              <div class="stage-name">${stage.title}</div>
              <div class="stage-video">${stage.video}</div>
            </div>
            <div class="stage-badge">${isDone ? "✓" : "→"}</div>
          `;
          btn.addEventListener("click", () => openDetail(stage.id));
          stageList.appendChild(btn);
        });

        container.appendChild(card);
      });

      if (!container.children.length) {
        container.innerHTML = `<div class="world-card" style="text-align:center;color:var(--muted);font-size:14px;">当前筛选下暂无关卡</div>`;
      }
    }

    function openDetail(stageId) {
      activeStageId = stageId;
      document.getElementById("viewMap").classList.add("hidden");
      document.getElementById("viewDetail").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderDetail();
    }

    function closeDetail() {
      activeStageId = null;
      document.getElementById("viewDetail").classList.add("hidden");
      document.getElementById("viewMap").classList.remove("hidden");
      renderMap();
    }

    function renderDetail() {
      const idx = allStages.findIndex(s => s.id === activeStageId);
      const stage = allStages[idx];
      if (!stage) return;

      const isDone = completed.has(stage.id);
      const prev = idx > 0 ? allStages[idx - 1] : null;
      const next = idx < allStages.length - 1 ? allStages[idx + 1] : null;
      const pickedMap = quizAnswers[stage.id] || {};

      const el = document.getElementById("viewDetail");
      el.innerHTML = `
        <button class="detail-back" id="backMapBtn">← 返回闯关地图</button>

        <div class="section-box">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <div style="font-size:12px;color:var(--muted);">${stage.worldName}</div>
              <h2 style="margin:4px 0 0;font-size:18px;font-weight:800;">关卡 ${stage.id} · ${stage.title}</h2>
            </div>
            <button id="toggleStageBtn" class="pill-btn" style="${isDone ? "background:var(--ok-soft);color:var(--ok);border-color:var(--ok);" : "background:var(--primary);color:#fff;border-color:var(--primary);"}">
              ${isDone ? "✓ 已通关" : "标记通关"}
            </button>
          </div>
          <div class="tag-video">🎬 ${stage.video}</div>
          <p style="margin:12px 0 0;font-size:14px;">${stage.summary}</p>
          <div class="formula-box">💡 ${stage.formula}</div>
          <div style="font-size:13px;font-weight:700;color:var(--muted);">📌 核心要点</div>
          <ul class="point-list">
            ${stage.points.map(p => `<li>${p}</li>`).join("")}
          </ul>
        </div>

        <div class="section-box">
          <div style="font-size:14px;font-weight:800;margin-bottom:4px;">✍️ 经典例句（点击 🔊 听发音）</div>
          ${stage.examples.map((ex, i) => `
            <div class="example-item">
              <div>
                <div style="font-size:14px;font-weight:600;">${ex.en}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">${ex.zh}</div>
              </div>
              <button class="speak-btn" data-speak="${i}" aria-label="朗读例句">🔊</button>
            </div>
          `).join("")}
        </div>

        <div class="section-box">
          <div style="font-size:14px;font-weight:800;">🎯 过关小测验（全部答对自动通关）</div>
          ${stage.quiz.map((q, qIdx) => {
            const picked = pickedMap[qIdx];
            const answered = picked !== undefined;
            const isCorrect = picked === q.answer;
            return `
              <div class="quiz-card">
                <div class="quiz-q">${qIdx + 1}. ${q.q}</div>
                ${q.options.map((opt, oIdx) => {
                  let cls = "";
                  if (answered) {
                    if (oIdx === q.answer) cls = "correct";
                    else if (oIdx === picked) cls = "wrong";
                  }
                  return `<button class="quiz-opt ${cls}" data-q="${qIdx}" data-o="${oIdx}">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
                }).join("")}
                ${answered ? `<div class="quiz-explain" style="color:${isCorrect ? "var(--ok)" : "var(--err)"}">${isCorrect ? "✅ 回答正确！" : "❌ 再看看："} ${q.explain}</div>` : ""}
              </div>
            `;
          }).join("")}

          <div class="nav-footer">
            <button class="btn-secondary" id="prevStageBtn" ${!prev ? "disabled" : ""}>← 上一关</button>
            <button class="btn-primary" id="nextStageBtn" ${!next ? "disabled" : ""}>下一关 ${next ? `(${next.id})` : ""} →</button>
          </div>
        </div>
      `;

      document.getElementById("backMapBtn").addEventListener("click", closeDetail);
      document.getElementById("toggleStageBtn").addEventListener("click", () => {
        if (completed.has(stage.id)) completed.delete(stage.id);
        else completed.add(stage.id);
        saveProgress();
        updateProgressUI();
        renderDetail();
      });

      el.querySelectorAll("[data-speak]").forEach(btn => {
        btn.addEventListener("click", () => {
          const ex = stage.examples[Number(btn.dataset.speak)];
          if (ex) speak(ex.en);
        });
      });

      el.querySelectorAll(".quiz-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const qIdx = Number(btn.dataset.q);
          const oIdx = Number(btn.dataset.o);
          if (!quizAnswers[stage.id]) quizAnswers[stage.id] = {};
          quizAnswers[stage.id][qIdx] = oIdx;

          const allRight = stage.quiz.every((q, i) => quizAnswers[stage.id][i] === q.answer);
          if (allRight) {
            completed.add(stage.id);
            saveProgress();
            updateProgressUI();
          }
          renderDetail();
        });
      });

      if (prev) {
        document.getElementById("prevStageBtn").addEventListener("click", () => openDetail(prev.id));
      }
      if (next) {
        document.getElementById("nextStageBtn").addEventListener("click", () => openDetail(next.id));
      }
    }

    function initPractice() {
      practiceQueue = allStages.flatMap(s =>
        s.quiz.map(q => ({ ...q, stageId: s.id, stageTitle: s.title }))
      );
      practiceQueue.sort(() => Math.random() - 0.5);
      practiceIdx = 0;
      practicePicked = null;
      renderPractice();
    }

    function renderPractice() {
      const box = document.getElementById("viewPractice");
      const item = practiceQueue[practiceIdx];
      if (!item) return;

      const answered = practicePicked !== null;
      const isCorrect = practicePicked === item.answer;

      box.innerHTML = `
        <div class="section-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="rank-badge">🎲 随机综合刷题</span>
            <span style="font-size:12px;color:var(--muted);">第 ${practiceIdx + 1} / ${practiceQueue.length} 题</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:8px;">来自：关卡 ${item.stageId} · ${item.stageTitle}</div>
          <div class="quiz-card">
            <div class="quiz-q">${item.q}</div>
            ${item.options.map((opt, oIdx) => {
              let cls = "";
              if (answered) {
                if (oIdx === item.answer) cls = "correct";
                else if (oIdx === practicePicked) cls = "wrong";
              }
              return `<button class="quiz-opt ${cls}" data-po="${oIdx}">${String.fromCharCode(65 + oIdx)}. ${opt}</button>`;
            }).join("")}
            ${answered ? `<div class="quiz-explain" style="color:${isCorrect ? "var(--ok)" : "var(--err)"}">${isCorrect ? "✅ 答对了！" : "❌ 解析："} ${item.explain}</div>` : ""}
          </div>
          <div class="nav-footer">
            <button class="btn-secondary" id="reshuffleBtn">重新洗牌</button>
            <button class="btn-primary" id="nextPracticeBtn">下一题 →</button>
          </div>
        </div>
      `;

      box.querySelectorAll("[data-po]").forEach(btn => {
        btn.addEventListener("click", () => {
          practicePicked = Number(btn.dataset.po);
          renderPractice();
        });
      });

      document.getElementById("reshuffleBtn").addEventListener("click", initPractice);
      document.getElementById("nextPracticeBtn").addEventListener("click", () => {
        practiceIdx = (practiceIdx + 1) % practiceQueue.length;
        practicePicked = null;
        renderPractice();
      });
    }

    function renderCheat() {
      const box = document.getElementById("viewCheat");
      box.innerHTML = `
        <div class="hero-card">
          <div style="font-size:16px;font-weight:800;">📖 英语全语法万能公式速查</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">手机随时打开复习，点击卡片可跳回对应关卡练习。</div>
        </div>
        ${allStages.map(s => `
          <div class="section-box" style="padding:13px 14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div style="font-size:14px;font-weight:700;">${s.id} · ${s.title}</div>
              <button class="pill-btn" data-jump="${s.id}">去练这关 →</button>
            </div>
            <div class="formula-box" style="margin:8px 0 0;font-size:13px;">${s.formula}</div>
          </div>
        `).join("")}
      `;

      box.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab("map");
          openDetail(btn.dataset.jump);
        });
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".nav-tab").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      document.getElementById("viewMap").classList.toggle("hidden", tab !== "map");
      document.getElementById("viewDetail").classList.add("hidden");
      document.getElementById("viewPractice").classList.toggle("hidden", tab !== "practice");
      document.getElementById("viewCheat").classList.toggle("hidden", tab !== "cheat");

      if (tab === "map") renderMap();
      if (tab === "practice" && !practiceQueue.length) initPractice();
      if (tab === "cheat") renderCheat();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        currentFilter = chip.dataset.filter;
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c === chip));
        renderMap();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确定要清空所有通关记录吗？")) return;
      completed.clear();
      quizAnswers = {};
      saveProgress();
      if (activeStageId) renderDetail();
      else renderMap();
    });

    renderMap();
  </script>
</body>
</html>
